version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deyaanat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deyaanat
      POSTGRES_USER: deyaanat
      POSTGRES_PASSWORD: deyaanat_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deyaanat -d deyaanat"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deyaanat-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://deyaanat:deyaanat_password@postgres:5432/deyaanat?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-in-production}
      PORT: 3001
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deyaanat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001/api/v1
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: deyaanat-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro

volumes:
  postgres_data:
  uploads_data:
